[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opennote"
version = "0.1.0"
description = "Terminal-based, NotebookLM-style grounded Q&A tool (BYOK)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "trafilatura>=1.8.0",
    "lxml_html_clean>=0.4.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=1.0.0",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "keyring>=24.0.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "anthropic>=0.40.0",
    "textual>=2.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.0",
    "edge-tts>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "reportlab>=4.0.0",
]

[project.scripts]
opennote = "opennote.cli:app"

[tool.setuptools.packages.find]
include = ["opennote*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"